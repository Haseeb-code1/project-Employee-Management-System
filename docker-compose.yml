services:
  web:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - FLASK_APP=webapp.py
      - DB_SERVER=host.docker.internal
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
