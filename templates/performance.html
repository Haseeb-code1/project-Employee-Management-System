{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
    <h2>Performance Evaluations</h2>
    <button class="btn btn-primary" onclick="toggleForm('addPerfForm')">Add Evaluation</button>
</div>

<div id="addPerfForm" class="form-container">
    <h3>Add Performance Evaluation</h3>
    <form method="POST" action="{{ url_for('create_performance') }}">
        <select name="employee_id" required>
            <option value="" disabled selected>Select Employee</option>
            {% for emp in employees %}
            <option value="{{ emp.id }}">{{ emp.name }}</option>
            {% endfor %}
        </select>
        <select name="rating" required>
            <option value="" disabled selected>Select Rating</option>
            <option value="1">1 - Poor</option>
            <option value="2">2 - Fair</option>
            <option value="3">3 - Good</option>
            <option value="4">4 - Very Good</option>
            <option value="5">5 - Excellent</option>
        </select>
        <textarea name="feedback" rows="4" placeholder="Feedback" required></textarea>
        <input type="date" name="date" required>
        <button type="submit" class="btn btn-success">Save</button>
        <button type="button" class="btn btn-danger" onclick="toggleForm('addPerfForm')">Cancel</button>
    </form>
</div>

<div class="card">
<div class="table-responsive">
    <table id="perfTable">
        <thead>
            <tr>
                <th onclick="sortTable(0, 'perfTable')">ID ↕</th>
                <th onclick="sortTable(1, 'perfTable')">Employee ↕</th>
                <th onclick="sortTable(2, 'perfTable')">Rating ↕</th>
                <th onclick="sortTable(3, 'perfTable')">Feedback ↕</th>
                <th onclick="sortTable(4, 'perfTable')">Date ↕</th>
            </tr>
        </thead>
        <tbody>
            {% for rec in records %}
            <tr>
                <td>{{ rec.id }}</td>
                <td>{{ rec.employee_name }}</td>
                <td>{{ rec.rating }}</td>
                <td>{{ rec.feedback }}</td>
                <td>{{ rec.date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</div>
{% endblock %}
