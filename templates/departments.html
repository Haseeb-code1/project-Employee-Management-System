{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
    <h2>Departments</h2>
    <button class="btn btn-primary" onclick="toggleForm('addDeptForm')">Add Department</button>
</div>

<div id="addDeptForm" class="form-container">
    <h3>Add New Department</h3>
    <form method="POST" action="{{ url_for('create_department') }}">
        <input type="text" name="name" placeholder="Department Name" required>
        <button type="submit" class="btn btn-success">Save</button>
        <button type="button" class="btn btn-danger" onclick="toggleForm('addDeptForm')">Cancel</button>
    </form>
</div>

<div class="card">
<div class="table-responsive">
    <table id="deptTable">
        <thead>
            <tr>
                <th onclick="sortTable(0, 'deptTable')">ID ↕</th>
                <th onclick="sortTable(1, 'deptTable')">Name ↕</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for dept in departments %}
            <tr>
                <td>{{ dept.id }}</td>
                <td>{{ dept.name }}</td>
                <td>
                    <button class="btn btn-warning" onclick="toggleForm('editDeptForm-{{ dept.id }}')">Edit</button>
                    <form method="POST" action="{{ url_for('remove_department', id=dept.id) }}" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this department?');">Delete</button>
                    </form>
                </td>
            </tr>
            <tr id="editDeptForm-{{ dept.id }}" class="form-container" style="display:none;">
                <td colspan="3">
                    <form method="POST" action="{{ url_for('edit_department', id=dept.id) }}">
                        <input type="text" name="name" value="{{ dept.name }}" required>
                        <button type="submit" class="btn btn-success">Update</button>
                        <button type="button" class="btn btn-danger" onclick="document.getElementById('editDeptForm-{{ dept.id }}').style.display='none'">Cancel</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</div>
{% endblock %}
